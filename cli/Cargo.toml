[package]
name = "tododrop"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "待办投递 PC 接收端：在局域网内接收手机导出的待办，按项目保存为 Markdown"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "tododrop"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
axum-server = { version = "0.9", features = ["tls-rustls-no-provider"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
directories = "6"
gethostname = "1"
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "time"] }
toml = "0.9"
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0.2"

[dev-dependencies]
tempfile = "3"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
